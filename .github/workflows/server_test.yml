name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Make build scripts executable
        run: chmod +x tools/*.sh

      - name: Build WASM and Engine Packages
        run: |
          ./tools/setup.sh


      - name: Start Web Server and Run Integration Tests
        run: |
          # Start server in background (adjust directory/command as needed)
          python -m http.server 8000 --directory frontend/app &
          
          # Wait a few seconds for the port to open
          sleep 3
          
          # Run tests
          python tools/test_server.py

