[package]
name = "crypto-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
bit-vec = { version = "0.6", features = ["serde"] }
serde_json = "1.0.149"
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]

